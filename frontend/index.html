<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inclusify — Curriculum Inclusivity Auditor</title>
<style>
/* ============================== Broadsheet design system (verbatim) ============================== */
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #0088b0;
  --color-accent-2: #d6006c;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #e9f8ff;
  --color-accent-200: #cbeeff;
  --color-accent-300: #99e0ff;
  --color-accent-400: #62c5ee;
  --color-accent-500: #38a6cf;
  --color-accent-600: #1186ac;
  --color-accent-700: #006786;
  --color-accent-800: #004961;
  --color-accent-900: #0a303e;

  --color-accent-2-100: #fff1f4;
  --color-accent-2-200: #ffdee6;
  --color-accent-2-300: #ffc0d0;
  --color-accent-2-400: #ff90b1;
  --color-accent-2-500: #ff458e;
  --color-accent-2-600: #d82071;
  --color-accent-2-700: #aa0b56;
  --color-accent-2-800: #790e3d;
  --color-accent-2-900: #4b1528;

  --font-heading: "Source Serif 4", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Source Serif 4", system-ui, sans-serif;

  --space-1: 5.0px;
  --space-2: 10.0px;
  --space-3: 15.0px;
  --space-4: 20.0px;
  --space-6: 30.0px;
  --space-8: 40.0px;

  --radius-sm: 1px;
  --radius-md: 2px;
  --radius-lg: 4px;

  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}
.halftone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);
  background-size:3px 3px;mix-blend-mode:multiply}

/* The big findings count. Was three offset CMYK plates in multiply blend (a
   misregistered-print look) — it read as blurry at 92px, so: one flat color. */
.big-num{font-family:var(--font-heading);font-weight:600;line-height:0.9;
  color:var(--color-accent-700);font-variant-numeric:tabular-nums lining-nums;
  /* Box hugs cap-height..baseline so the flex-end row aligns on the baseline, not on
     the descender gap. Unsupported -> a few px of slack below, nothing breaks. */
  text-box:trim-both cap alphabetic}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }

.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* ============================== Page-level additions (not in broadsheet.css) ============================== */
html, body { max-width: 100%; overflow-x: hidden; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
.kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
.nav a { color: var(--color-text); text-decoration: none; font-size: 15px; }
.nav a[aria-current="page"] { color: var(--color-accent); }
pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
      font-family: ui-monospace, Menlo, Consolas, monospace; }
.table-wrap { overflow-x: auto; }
.trace-drawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
                background: var(--color-bg); box-shadow: var(--shadow-lg);
                border-top: 3px solid var(--color-text); }
.src-span { outline-offset: 3px; }

@keyframes pulseInk { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
@keyframes riseIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (max-width: 860px) {
  .source-panel { position: static !important; top: auto !important; }
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div style="height:5px;background:var(--color-text)"></div>
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:16px;padding:7px 0 6px">
      <span class="kicker">Technion 00960237 · AI Agent Systems</span>
      <span class="kicker" style="margin-left:auto">Report schema v2.0</span>
      <span class="kicker" id="provider-chip" style="color:var(--color-accent-700)">MockLLM · hash embedder · seeded in-memory store</span>
    </div>
    <div style="height:1px;background:var(--color-text)"></div>
    <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;padding:22px 0 18px">
      <div>
        <div style="font-family:var(--font-heading);font-weight:600;font-size:52px;line-height:.95;letter-spacing:-.02em">Inclusify</div>
        <div style="font-size:14px;max-width:44ch;margin-top:8px;color:color-mix(in srgb,var(--color-text) 62%,transparent)">An autonomous curriculum-inclusivity auditor. Orchestrator–workers over LangGraph, offline-first.</div>
      </div>
      <nav class="nav" style="display:flex;flex-wrap:wrap;gap:22px;margin-left:auto;padding-bottom:6px">
        <a href="#audit" id="nav-audit" onclick="event.preventDefault();UI.nav('audit')">Audit</a>
        <a href="#agent" id="nav-agent" onclick="event.preventDefault();UI.nav('agent')">Agent</a>
        <a href="#metrics" id="nav-metrics" onclick="event.preventDefault();UI.nav('metrics')">Metrics</a>
        <a href="#team" id="nav-team" onclick="event.preventDefault();UI.nav('team')">Team</a>
      </nav>
    </div>
    <div style="height:1px;background:var(--color-divider)"></div>
  </div>
</header>

<main class="container" style="padding-bottom:140px">
  <section id="sec-audit" data-screen-label="Audit"><div id="audit-container"></div></section>
  <section id="sec-agent" data-screen-label="Agent" style="display:none;padding:44px 0 0"><div id="agent-container"></div></section>
  <section id="sec-metrics" data-screen-label="Metrics" style="display:none;padding:44px 0 0"><div id="metrics-container"></div></section>
  <section id="sec-team" data-screen-label="Team" style="display:none;padding:44px 0 0"><div id="team-container"></div></section>
</main>

<script>
"use strict";

/* ============================== constants ============================== */

// ponytail: verbatim from data/fixtures/sample.txt (byte-exact incl. trailing newline) —
// keep in sync if that file ever changes.
const FIXTURE_TEXT = `The chairman of the department will manage the freshmen orientation, and his secretary will assist.
Each student should bring his own laptop. The blacklist of plagiarism cases is reviewed annually by the manpower committee.
`;

const STAGES = [
  { name: "Guards", kind: "code · no LLM", blurb: "Language + size checks — no LLM call." },
  { name: "Chunker", kind: "code · no LLM", blurb: "Splits the raw text into blocks, sentences, and windows." },
  { name: "LexiconScanner", kind: "code · no LLM", blurb: "Scans for known terms — sensor hints, never auto-flags." },
  { name: "DocumentAuditor", kind: "LLM · 1 call / window", blurb: "Reads each window, proposes candidate spans." },
  { name: "EvidenceInvestigator", kind: "LLM tool-loop · parallel ≤5", blurb: "Researches each candidate against the corpus." },
  { name: "ReportConsolidator", kind: "LLM · 1 call", blurb: "Retracts, groups, and orders confirmed findings." },
  { name: "Report", kind: "code · no LLM", blurb: "Renders markdown + JSON (schema 2.0) + steps[]." },
];

const ENDPOINTS = [
  { path: "GET /api/team_info", returns: "team + students" },
  { path: "GET /api/agent_info", returns: "description, purpose, prompt_template, prompt_examples" },
  { path: "GET /api/model_architecture", returns: "architecture diagram (image/png)" },
  { path: "POST /api/execute", returns: "{status, error, response, steps} — response is the markdown report; steps traces every LLM call" },
  { path: "POST /api/execute?ui=1", returns: "the GUI's structured superset of the same run — adds report JSON + span offsets (alias: /api/ui/execute)" },
  { path: "POST /api/why", returns: "{explanation, citations, augmented_prompt, steps} — one EvidenceInvestigator over a user-supplied span" },
  { path: "GET /api/health", returns: "{status, llm, model, embeddings, vector_store, persistence, eric_live}" },
];

const AUTONOMY = [
  { decision: "Which spans are candidates, including implied bias with no trigger word", by: "DocumentAuditor" },
  { decision: "How many investigators spawn — fan-out is input-dependent", by: "Auditor output → LangGraph Send" },
  { decision: "What evidence would prove or refute a finding — the query itself", by: "EvidenceInvestigator" },
  { decision: "Whether local evidence is sufficient, or the live ERIC API is needed", by: "EvidenceInvestigator" },
  { decision: "Confirm or reject its own candidate", by: "EvidenceInvestigator" },
  { decision: "Retract, merge, and pattern-group across findings", by: "ReportConsolidator" },
];

const LEVERS = [
  { name: "No routing calls", how: "Control flow is code; the LLM is called only where judgment is contingent." },
  { name: "Document read ≈ once", how: "Windows, not per-sentence prompts — v1 resent a 1.4k-token system prompt per sentence." },
  { name: "Identical system prompt", how: "Fixed curated exemplars, so the provider KV-caches across windows and runs." },
  { name: "Recurrence dedup", how: "One investigation per framing; the verdict applies to every occurrence." },
  { name: "Skip-if-empty", how: "No consolidator call on a clean document; no investigators without candidates." },
  { name: "Hard bounds", how: "≤4 turns per investigation · ≤5 concurrent · ≤10 windows · one JSON-repair retry." },
];

const DOC_METRICS = [
  { label: "Span detection, label-agnostic (≥50% overlap)", value: "P 0.121 · R 0.250 · F1 0.163" },
  { label: "Strict span + expert label, micro F1", value: "0.059" },
  { label: "Predictions on expert-approved spans", value: "12 of 66" },
  { label: "Wall clock / LLM calls / parse failures", value: "212 s · 231 · 0" },
];

const TEAM_STACK = [
  { role: "Orchestration", what: "LangGraph Send · orchestrator–workers with evaluator loops" },
  { role: "LLM", what: "MockLLM offline · gpt-5.4-mini via the LLMod.ai proxy live" },
  { role: "Embeddings", what: "hash offline · text-embedding-3-small live" },
  { role: "Vector store", what: "in-memory / Chroma offline · Pinecone (ERIC, 21,870 chunks) live" },
  { role: "Persistence", what: "null offline · Supabase audit_runs with the token ledger" },
  { role: "Serving", what: "FastAPI on Vercel · 300 s cap, window guard well inside it" },
];

// ponytail: this is copy, not a live metric (no endpoint reports a test count) --
// re-paste the final `pytest tests -q` number here if the suite grows meaningfully.
const TEST_COUNT = "244";

/* ============================== helpers ============================== */

function esc(s) {
  return String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
const escAttr = esc;

function hostOf(url) {
  try { return new URL(url).hostname; } catch (e) { return url; }
}

// Evidence URLs come from the RAG corpus / live ERIC results -- not LLM free text, but
// not first-party either. Only ever land an http(s) URL in an href; anything else
// (javascript:, data:, a malformed string) degrades to "#" rather than being followed.
function safeHref(url) {
  try {
    const u = new URL(url, window.location.href);
    return u.protocol === "http:" || u.protocol === "https:" ? u.href : "#";
  } catch (e) { return "#"; }
}

function prefersReducedMotion() {
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function scrollToId(id) {
  requestAnimationFrame(() => {
    const el = document.getElementById(id);
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "center" });
  });
}

function copyText(text) {
  try { navigator.clipboard.writeText(text); } catch (e) { /* clipboard unavailable in this context */ }
}

function titleCaseProvider(s) {
  const map = { chroma: "Chroma", pinecone: "Pinecone", inmemory: "In-memory", supabase: "Supabase", null: "None" };
  if (map[s]) return map[s];
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function metaLineText(text) {
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const tokens = Math.round(words * 1.3);
  const windows = Math.max(1, Math.ceil(tokens / 1800));
  return `${chars} characters · ≈${tokens} tokens · ${windows} window${windows === 1 ? "" : "s"}`;
}

/* ============================== state ============================== */

const state = {
  tab: "audit",
  health: null,
  agentInfo: null,
  teamInfo: null,
  lastSteps: null,       // steps[] from the last successful /api/execute?ui=1 call (Metrics tab ledger)
  audit: {
    phase: "idle",        // idle | running | report
    text: FIXTURE_TEXT,
    error: null,
    timers: [], intervalId: null,
    stageDone: [false, false, false, false, false, false, false],
    stageActive: false,
    fetchElapsed: "0.0 s",
    fanoutRows: null,
    report: null, ui: null, steps: null,
    sel: null, open: null,
    whyOpen: {}, whyCache: {}, whyLoading: {},
    traceOpen: false, openStep: null,
    copied: {}, jsonCopied: false,
  },
};

/* ============================== header / nav / tabs ============================== */

function setProviderChip(health) {
  const el = document.getElementById("provider-chip");
  if (!el) return;
  if (!health || health.llm === "mock") {
    el.textContent = "MockLLM · hash embedder · seeded in-memory store";
    return;
  }
  const vs = titleCaseProvider(health.vector_store);
  const persist = titleCaseProvider(health.persistence);
  const model = health.model || health.llm;
  el.textContent = `${model} via LLMod.ai · ${vs} · ${persist}`;
}

function showTab(tab) {
  state.tab = tab;
  ["audit", "agent", "metrics", "team"].forEach((t) => {
    const sec = document.getElementById("sec-" + t);
    if (sec) sec.style.display = t === tab ? "" : "none";
    const link = document.getElementById("nav-" + t);
    if (link) { if (t === tab) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current"); }
  });
  if (tab === "audit") renderAudit();
  else if (tab === "agent") { if (state.agentInfo) renderAgent(); else loadAgentInfo(); }
  else if (tab === "metrics") renderMetrics();
  else if (tab === "team") { if (state.teamInfo) renderTeam(); else loadTeamInfo(); }
}

function loadHealth() {
  fetch("/api/health").then((r) => r.json()).then((h) => { state.health = h; setProviderChip(h); }).catch(() => setProviderChip(null));
}

function examplesListHtml() {
  const examples = (state.agentInfo && state.agentInfo.prompt_examples) || [];
  const rows = examples.map((ex, i) => `
    <button onclick="UI.fillExample(${i})" style="text-align:left;background:transparent;border:0;border-top:1px solid var(--color-divider);padding:13px 2px;font:inherit;font-size:15px;color:var(--color-text);cursor:pointer;display:flex;gap:14px;align-items:baseline;width:100%">
      <span style="font-size:11px;letter-spacing:.1em;color:var(--color-accent);flex:none">${String(i + 1).padStart(2, "0")}</span>
      <span style="text-wrap:pretty">${esc(ex.prompt)}</span>
    </button>`).join("");
  const fixtureN = String(examples.length + 1).padStart(2, "0");
  const fixtureRow = `
    <button onclick="UI.fillFixture()" style="text-align:left;background:transparent;border:0;border-top:1px solid var(--color-divider);padding:13px 2px;font:inherit;font-size:15px;color:var(--color-text);cursor:pointer;display:flex;gap:14px;align-items:baseline;width:100%">
      <span style="font-size:11px;letter-spacing:.1em;color:var(--color-accent);flex:none">${fixtureN}</span>
      <span style="text-wrap:pretty">data/fixtures/sample.txt — the repo's offline demo input (loaded).</span>
    </button>`;
  return rows + fixtureRow;
}

function loadAgentInfo() {
  fetch("/api/agent_info").then((r) => r.json()).then((info) => {
    state.agentInfo = info;
    const list = document.getElementById("examples-list");
    if (list) list.innerHTML = examplesListHtml();      // targeted update — never touches the textarea
    if (state.tab === "agent") renderAgent();
  }).catch(() => {});
}

function loadTeamInfo() {
  fetch("/api/team_info").then((r) => r.json()).then((info) => {
    state.teamInfo = info;
    if (state.tab === "team") renderTeam();
  }).catch(() => {});
}

/* ============================== Agent tab ============================== */

function renderAgent() {
  const container = document.getElementById("agent-container");
  const info = state.agentInfo;
  if (!info) { container.innerHTML = `<p class="text-muted" style="padding:44px 0">Loading…</p>`; return; }
  const endpointRows = ENDPOINTS.map((e) => `<tr><td style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:nowrap">${esc(e.path)}</td><td style="font-size:13.5px">${esc(e.returns)}</td></tr>`).join("");
  const autonomyRows = AUTONOMY.map((a) => `<div style="border-top:1px solid var(--color-divider);padding:11px 0"><div style="font-size:14.5px;text-wrap:pretty">${esc(a.decision)}</div><div style="font-size:11.5px;color:var(--color-accent-700);margin-top:2px">${esc(a.by)}</div></div>`).join("");
  container.innerHTML = `
  <div style="display:flex;flex-wrap:wrap;gap:56px">
    <div style="flex:1 1 520px;min-width:320px">
      <div class="kicker" style="color:var(--color-accent-700)">GET /api/agent_info</div>
      <h2 style="font-size:34px;margin:10px 0 14px;max-width:22ch">What the agent is, and what it refuses to be.</h2>
      <p style="font-size:16px;line-height:1.7;max-width:66ch;text-wrap:pretty">${esc(info.description)}</p>

function buildLedgerRows() {
  const steps = state.lastSteps || [];
  const byModule = {}, order = [];
  steps.forEach((s) => {
    if (!byModule[s.module]) { byModule[s.module] = { calls: 0, tin: 0, tout: 0, hasUsage: false }; order.push(s.module); }
    const m = byModule[s.module];
    m.calls += 1;
    if (s.usage) { m.hasUsage = true; m.tin += s.usage.in; m.tout += s.usage.out; }
  });
  const rows = order.map((mod) => {
    const m = byModule[mod];
    return { module: mod, calls: m.calls, tin: m.hasUsage ? m.tin : null, tout: m.hasUsage ? m.tout : null };
  });
  const anyUsage = rows.some((r) => r.tin != null);
  rows.push({
    module: "Total", calls: steps.length,
    tin: anyUsage ? rows.reduce((a, r) => a + (r.tin || 0), 0) : null,
    tout: anyUsage ? rows.reduce((a, r) => a + (r.tout || 0), 0) : null,
  });
  return rows;
}

/* ---- running (honest theater: one blocking fetch, no fake numbers) ---- */

function clearRunTimers() {
  const st = state.audit;
  (st.timers || []).forEach(clearTimeout);
  if (st.intervalId) clearInterval(st.intervalId);
  st.timers = [];
  st.intervalId = null;
}

function runHeadline(st) {
  if (!(st.stageDone[0] && st.stageDone[1] && st.stageDone[2])) return "Reading the document.";
  if (!st.stageDone[4]) return "Investigating candidates in parallel.";
  return "Consolidating the report.";
}

function verdictLabelFor(confidence) { return confidence === "low" ? "low confidence" : "confirmed"; }
function verdictColorFor(v) {
  if (v === "rejected") return "color-mix(in srgb, var(--color-text) 55%, transparent)";
  if (v === "low confidence") return "var(--color-accent-2-700)";
  return "var(--color-accent-700)";
}

// One row per Investigation, reconstructed from the response (report.findings are
// every CONFIRMED investigation, kept+retracted; ui.rejected are the rest) — there is
// no separate "investigations" array on the wire, so this is the full set either way.
function buildFanoutRows(data) {
  const rows = [];
  (data.report.findings || []).forEach((f) => {
    const trace = f.grounded ? `grounded · ${f.evidence.length} source${f.evidence.length === 1 ? "" : "s"}` : "ungrounded — flagged for human review";
    rows.push({ id: f.id, quote: f.quote, verdict: verdictLabelFor(f.confidence), trace });
  });
  (data.ui.rejected || []).forEach((r, i) => {
    rows.push({ id: "r" + i, quote: r.quote, verdict: "rejected", trace: r.explanation });
  });
  return rows;
}

function renderFanoutList(rows) {
  return `<div style="display:flex;flex-direction:column;gap:7px;margin-top:12px;padding-left:2px;border-left:2px solid var(--color-accent-200)">
    ${rows.map((w) => `<div style="display:flex;gap:12px;align-items:baseline;padding-left:14px;font-size:13px">
      <span style="font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 45%,transparent);flex:none">${esc(w.id)}</span>
      <span style="font-style:italic;flex:none">“${esc(w.quote)}”</span>
      <span style="color:color-mix(in srgb,var(--color-text) 55%,transparent);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.trace)}</span>
      <span style="margin-left:auto;flex:none;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:${verdictColorFor(w.verdict)}">${esc(w.verdict)}</span>
    </div>`).join("")}
  </div>`;
}

function renderStageRow(s, i, st) {
  const done = st.stageDone[i];
  const active = !done && st.stageActive && (i === 3 || i === 4);
  const mark = done ? "✓" : active ? "▸" : "·";
  const markColor = done ? "var(--color-accent)" : active ? "var(--color-accent-2)" : "var(--color-neutral-400)";
  const anim = active ? "pulseInk 1.1s ease-in-out infinite" : "none";
  const opacity = done || active ? 1 : 0.34;
  const timing = active ? esc(st.fetchElapsed) : "";
  const detail = i === 4 && active ? "spawning investigators — ≤5 in parallel…" : esc(s.blurb);
  const fanout = i === 4 && st.fanoutRows ? renderFanoutList(st.fanoutRows) : "";
  return `<div style="border-top:1px solid var(--color-divider);padding:15px 0;display:flex;gap:18px;align-items:flex-start;opacity:${opacity}">
    <span style="flex:none;width:18px;font-size:11px;font-variant-numeric:tabular-nums;color:${markColor};padding-top:4px;animation:${anim}">${mark}</span>
    <div style="flex:1 1 auto;min-width:0">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:baseline">
        <span style="font-family:var(--font-heading);font-weight:600;font-size:19px">${esc(s.name)}</span>
        <span class="tag tag-neutral" style="font-size:10px">${esc(s.kind)}</span>
        <span style="margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--color-text) 50%,transparent)">${timing}</span>
      </div>
      <div style="font-size:14px;margin-top:3px;color:color-mix(in srgb,var(--color-text) 68%,transparent)">${detail}</div>
      ${fanout}
    </div>
  </div>`;
}

function renderAuditRunning() {
  const st = state.audit;
  const rows = STAGES.map((s, i) => renderStageRow(s, i, st)).join("");
  return `<div style="padding:44px 0 0;max-width:900px">
    <div class="kicker" style="color:var(--color-accent-700)">Running · POST /api/execute</div>
    <h2 style="font-size:34px;margin:10px 0 30px">${esc(runHeadline(st))}</h2>
    <div style="display:flex;flex-direction:column">${rows}<div style="border-top:1px solid var(--color-divider)"></div></div>
  </div>`;
}

function startRun() {
  const st = state.audit;
  clearRunTimers();
  st.phase = "running";
  st.error = null;
  st.stageDone = [false, false, false, false, false, false, false];
  st.stageActive = false;
  st.fetchElapsed = "0.0 s";
  st.fanoutRows = null;
  const submitted = st.text;
  renderAudit();

  const timers = [];
  [150, 300, 450].forEach((ms, i) => {
    timers.push(setTimeout(() => { st.stageDone[i] = true; renderAudit(); }, ms));
  });
  timers.push(setTimeout(() => { st.stageActive = true; renderAudit(); }, 470));

  const fetchStart = performance.now();
  st.intervalId = setInterval(() => {
    st.fetchElapsed = ((performance.now() - fetchStart) / 1000).toFixed(1) + " s";
    renderAudit();
  }, 100);
  st.timers = timers;

  fetch("/api/execute?ui=1", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: submitted }),
  }).then((r) => r.json()).then((data) => {
    clearRunTimers();
    if (data.status !== "ok") {
      st.phase = "idle";
      st.error = data.error || "Something went wrong.";
      renderAudit();
      return;
    }
    st.stageActive = false;
    st.stageDone[3] = true;
    st.stageDone[4] = true;
    st.fanoutRows = buildFanoutRows(data);
    renderAudit();
    const t1 = setTimeout(() => { st.stageDone[5] = true; renderAudit(); }, 280);
    const t2 = setTimeout(() => { st.stageDone[6] = true; renderAudit(); }, 560);
    const t3 = setTimeout(() => {
      st.phase = "report";
      st.report = data.report; st.ui = data.ui; st.steps = data.steps;
      st.response = data.response; st.rawOpen = false;
      st.sel = null; st.open = null;
      st.whyOpen = {}; st.whyCache = {}; st.whyLoading = {};
      st.traceOpen = false; st.openStep = null;
      st.copied = {}; st.jsonCopied = false;
      state.lastSteps = data.steps;
      renderAudit();
      renderMetrics();
    }, 900);
    st.timers = [t1, t2, t3];
  }).catch((err) => {
    clearRunTimers();
    st.phase = "idle";
    st.error = "Could not reach the agent: " + err.message;
    renderAudit();
  });
}

/* ---- report ---- */

function confidenceMeta(conf) {
  const w = conf === "high" ? "100%" : conf === "medium" ? "60%" : "28%";
  const color = conf === "low" ? "var(--color-accent-2)" : "var(--color-accent)";
  return { w, color };
}

function ungroundedNote(f) {
  const base = "No evidence cleared the retrieval floor. The finding stands on the model's judgment alone — flagged for human review";
  return f.retracted ? base + ", and retracted by the consolidator." : base + ".";
}

function findFinding(id) {
  const st = state.audit;
  return st.report && st.report.findings.find((f) => f.id === id);
}

// Overlap-safe highlight ranges (kept/retracted findings + rejected candidates):
// sort by (start asc, length desc), drop anything overlapping an already-accepted range.
// ponytail: rejected investigations never carry a stable candidate id over the wire
// (report.findings only holds CONFIRMED investigations, kept+retracted) -- "r"+index
// is a display-only id local to this render, consistent across buildSourceRanges/
// buildFanoutRows/renderRetractedAndRejected since ui.rejected's array order is stable
// within one response.
function buildSourceRanges(ui, findings) {
  const ranges = [];
  findings.forEach((f) => {
    const kind = f.retracted ? "retracted" : "kept";
    (ui.occurrences[f.id] || []).forEach(([s, e]) => ranges.push({ start: s, end: e, kind, id: f.id }));
  });
  (ui.rejected || []).forEach((r, i) => {
    const id = "r" + i;
    (r.occurrences || []).forEach(([s, e]) => ranges.push({ start: s, end: e, kind: "rejected", id }));
  });
  ranges.sort((a, b) => a.start - b.start || (b.end - b.start) - (a.end - a.start));
  const accepted = [];
  for (const r of ranges) {
    if (accepted.some((a) => r.start < a.end && r.end > a.start)) continue;
    accepted.push(r);
  }
  accepted.sort((a, b) => a.start - b.start);
  return accepted;
}

function spanStyle(kind) {
  if (kind === "kept") return "cursor:pointer;background:var(--color-accent-100);box-shadow:inset 0 -2px 0 var(--color-accent)";
  if (kind === "retracted") return "cursor:pointer;background:var(--color-accent-2-100);box-shadow:inset 0 -2px 0 var(--color-accent-2);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--color-accent-2) 60%,transparent)";
  return "cursor:pointer;box-shadow:inset 0 -1px 0 var(--color-neutral-400);color:var(--color-neutral-700)";
}

function renderSourceSpans(text, ranges) {
  const st = state.audit;
  let out = "", cursor = 0;
  for (const r of ranges) {
    if (r.start < cursor) continue; // safety: never render a negative-length text node
    out += esc(text.slice(cursor, r.start));
    const selected = st.sel === r.id;
    const outline = selected ? "outline:2px solid var(--color-accent);outline-offset:3px" : "outline:none";
    const call = `UI.pickSpan('${r.kind}','${r.id}')`;
    out += `<span class="src-span" role="button" tabindex="0" style="${spanStyle(r.kind)};${outline}" onclick="${call}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${call}}">${esc(text.slice(r.start, r.end))}</span>`;
    cursor = r.end;
  }
  out += esc(text.slice(cursor));
  return out;
}

function renderPatternBlocks(report) {
  if (!report.patterns || !report.patterns.length) return "";
  return report.patterns.map((p) => `
    <div style="height:1px;background:var(--color-divider);margin:26px 0 16px"></div>
    <div class="kicker text-muted" style="margin-bottom:14px">Recurring pattern</div>
    <div style="font-size:15px;font-family:var(--font-heading);font-weight:600">${esc(p.framing)}</div>
    <div style="font-size:12.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:3px">${esc(p.category)} · grouped across ${p.finding_ids.map((x) => esc(x)).join(", ")} — investigated once, verdict applied to all occurrences</div>
  `).join("");
}

// ponytail: a per-turn evidence *count* (as in "N snippets") isn't in the wire data --
// /api/why's steps[] only records the LLM's own JSON action per turn, not the
// corpus_search/live_search results (those never go through llm.complete). Showing the
// real query/verdict text instead of a fabricated count keeps this honest; add a count
// if /api/why ever threads per-turn evidence into the step record.
function whyStepSummary(step, i) {
  const resp = step.response;
  const n = i + 1;
  if (!resp || typeof resp !== "object") return `turn ${n} · (unparsed response)`;
  const act = resp.action || "unknown";
  if (act === "corpus_search") return `turn ${n} · corpus_search — “${resp.query || ""}”`;
  if (act === "live_search") return `turn ${n} · live_search — ${(resp.phrases || []).join(", ")}`;
  if (act === "finalize") return `turn ${n} · finalize — ${resp.verdict || ""}${resp.confidence ? " · " + resp.confidence + " confidence" : ""}`;
  return `turn ${n} · ${act}`;
}

}

    <div id="fcard-${f.id}" role="button" tabindex="0" aria-expanded="${isOpen}" style="cursor:pointer;display:flex;gap:14px;align-items:baseline" onclick="UI.selectFinding('${f.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();UI.selectFinding('${f.id}')}">

      <div style="flex:1 1 auto;min-width:0">

function renderRetractedAndRejected(report, ui) {
  const retracted = report.findings.filter((f) => f.retracted);
  const rejected = ui.rejected || [];
  if (!retracted.length && !rejected.length) return "";
  const st = state.audit;
  let html = `<div style="border-top:1px solid var(--color-divider);padding:26px 0 0">`;
  if (retracted.length) {
    html += `<div class="kicker" style="color:var(--color-accent-2-700);margin-bottom:12px">Walked back by the ReportConsolidator</div>`;
    html += retracted.map((f) => `
      <div id="finding-${f.id}" style="margin-bottom:16px;scroll-margin-top:24px;background:${st.sel === f.id ? "color-mix(in srgb, var(--color-accent-2) 6%, transparent)" : "transparent"}">
        <div style="font-size:17px;font-family:var(--font-heading);font-weight:600">“${esc(f.quote)}” <span style="font-weight:400;font-size:14px;color:color-mix(in srgb,var(--color-text) 55%,transparent)">— ${esc(f.category)} · ${esc(f.confidence)} confidence</span></div>
        <div style="font-size:13.5px;margin-top:5px;max-width:68ch;color:color-mix(in srgb,var(--color-text) 66%,transparent);text-wrap:pretty">Retracted: ${esc(f.retraction_rationale || "")}</div>
      </div>`).join("");
  }
  if (rejected.length) {
    html += `<div class="kicker text-muted" style="margin:24px 0 12px">Rejected at verification — never became findings</div>`;
    html += rejected.map((r, i) => `
      <div id="rejected-r${i}" style="font-size:15px;margin-bottom:8px;scroll-margin-top:24px;background:${st.sel === "r" + i ? "color-mix(in srgb, var(--color-text) 6%, transparent)" : "transparent"}">“${esc(r.quote)}” <span style="font-size:13.5px;color:color-mix(in srgb,var(--color-text) 60%,transparent)">— ${esc(r.explanation)}</span></div>`).join("");
  }
  html += `</div>`;
  return html;
}

function renderCaveats() {
  return `<div style="border-top:1px solid var(--color-divider);margin-top:30px;padding:18px 0 0;max-width:70ch">
    <div class="kicker text-muted" style="margin-bottom:8px">Read this with the measured limits</div>
    <div style="font-size:13px;line-height:1.65;color:color-mix(in srgb,var(--color-text) 62%,transparent);text-wrap:pretty">Sentence-level judgment agrees with expert labels 91% of the time (F1 0.911). Reproducing an expert team's <em>span selection</em> across a dense paper is the open frontier — document-level F1 0.163 on one annotated paper. Treat findings as a reviewer's shortlist, not a verdict.</div>
  </div>`;
}

function stepSummary(step) {
  const resp = step.response;
  if (step.module === "DocumentAuditor") {
    if (resp && typeof resp === "object" && Array.isArray(resp.candidates)) {
      const hv = Array.isArray(resp.hint_verdicts) ? resp.hint_verdicts.length : 0;
      return `window — ${resp.candidates.length} candidate${resp.candidates.length === 1 ? "" : "s"}, ${hv} hint verdict${hv === 1 ? "" : "s"}`;
    }
    return "window — (unparsed response)";
  }
  if (step.module === "EvidenceInvestigator") {
    // The real prompt says `Quote: "..."`; fall back to a `CANDIDATE: "..."` line
    // (a format some scripted/mock prompts use) so this stays robust either way.
    const m = /Quote:\s*"([^"]*)"/.exec(step.prompt.User_prompt) || /CANDIDATE:\s*"([^"]*)"/.exec(step.prompt.User_prompt);
    const quote = m ? m[1] : null;
    const action = resp && typeof resp === "object" ? resp.action || "?" : "(unparsed)";
    return quote ? `“${quote}” · ${action}` : action;
  }
  if (step.module === "ReportConsolidator") {
    if (resp && typeof resp === "object") {
      const kept = Array.isArray(resp.kept) ? resp.kept.length : 0;
      const retr = Array.isArray(resp.retracted) ? resp.retracted.length : 0;
      return `${kept} kept · ${retr} retracted`;
    }
    return "(unparsed response)";
  }
  return step.module;
}

        </div>

          <div style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent)">prompt.User_prompt</div>

        </div>

        </div>

    }).join("") + `<div style="border-top:1px solid var(--color-divider)"></div>`;
  }
  return `<div class="trace-drawer">
    <div id="tracebtn" role="button" tabindex="0" style="cursor:pointer;max-width:1280px;margin:0 auto;padding:13px 32px;display:flex;flex-wrap:wrap;gap:16px;align-items:baseline" onclick="UI.toggleTrace()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();UI.toggleTrace()}">

function renderSummaryStrip(report, ui, stepsLen) {
  const s = report.summary;
  const cells = [
    ["windows", s.windows], ["candidates", s.candidates], ["confirmed", s.confirmed],
    ["rejected", s.rejected], ["retracted", s.retracted], ["needs human review", s.needs_human_review],
    ["patterns", s.patterns], ["LLM calls", stepsLen], ["wall clock", ui.duration_s.toFixed(1) + " s"],
  ];
  if (ui.tokens_in != null || ui.tokens_out != null) cells.push(["tokens", `${Number(ui.tokens_in ?? 0).toLocaleString()} in / ${Number(ui.tokens_out ?? 0).toLocaleString()} out`]);
  return cells.map(([label, value]) => `<span><span style="color:color-mix(in srgb,var(--color-text) 50%,transparent)">${esc(label)}</span> <strong style="font-family:var(--font-heading)">${esc(String(value))}</strong></span>`).join("");
}

function renderAuditReport() {
  const st = state.audit;
  const report = st.report, ui = st.ui, steps = st.steps || [];
  const kept = report.findings.filter((f) => !f.retracted);
  const summary = report.summary;

  const subParts = [];
  if (summary.retracted) subParts.push(`${summary.retracted} retracted during review`);
  if (summary.needs_human_review) subParts.push(`${summary.needs_human_review} needs human review`);
  const subLine = subParts.join(" · ");

  const ranges = buildSourceRanges(ui, report.findings);
  const sourceHtml = renderSourceSpans(st.text, ranges);

  const findingsHtml = kept.length
    ? kept.map((f) => renderFindingCard(f)).join("")
    : `<p class="text-muted" style="font-size:14.5px">No inclusivity issues were confirmed in this document.</p>`;

  return `
  <div style="padding:40px 0 0">
    <div style="display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;padding-bottom:26px">
      <div style="display:flex;gap:22px;align-items:flex-end">
        <span class="big-num" style="font-size:92px">${summary.confirmed}</span>
        <div style="padding-bottom:10px">
          <div style="font-family:var(--font-heading);font-weight:600;font-size:26px;line-height:1.1">findings confirmed</div>

        </div>
      </div>
      <div style="margin-left:auto;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="UI.resetAudit()">New audit</button>
        <button class="btn btn-secondary" onclick="UI.toggleRaw()">${st.rawOpen ? "Hide raw response" : "Raw response"}</button>
        <button class="btn btn-secondary" id="copyjsonbtn" onclick="UI.copyReportJson()">${st.jsonCopied ? "Copied report JSON" : "Copy report JSON"}</button>
      </div>
    </div>

    <div style="height:1px;background:var(--color-text)"></div>
    <div style="display:flex;flex-wrap:wrap;gap:0 26px;padding:11px 0;font-size:12.5px;font-variant-numeric:tabular-nums">${renderSummaryStrip(report, ui, steps.length)}</div>
    <div style="height:1px;background:var(--color-divider)"></div>
    ${st.rawOpen ? `
    <div style="padding-top:18px">
      <div class="kicker text-muted" style="margin-bottom:8px">Raw response — the exact response string returned by POST /api/execute</div>
      <pre style="font-size:12px;line-height:1.7;margin:0;padding:16px;border:1px solid var(--color-divider);white-space:pre-wrap;max-height:420px;overflow:auto">${esc(st.response || "")}</pre>
    </div>` : ""}

    <div style="display:flex;flex-wrap:wrap;gap:48px;padding-top:32px;align-items:flex-start">
      <div class="source-panel" style="flex:1 1 400px;min-width:300px;position:sticky;top:20px">
        <div class="kicker text-muted" style="margin-bottom:14px">Source · ${st.text.length} chars · ${summary.windows} window${summary.windows === 1 ? "" : "s"}</div>
        <p style="font-size:19px;line-height:1.85;margin:0;white-space:pre-wrap">${sourceHtml}</p>
        <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:24px;font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)">
          <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:8px;background:var(--color-accent-100);box-shadow:inset 0 -2px 0 var(--color-accent)"></span>confirmed</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:8px;background:var(--color-accent-2-100);box-shadow:inset 0 -2px 0 var(--color-accent-2)"></span>retracted</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:8px;box-shadow:inset 0 -1px 0 var(--color-neutral-400)"></span>rejected at verification</span>
        </div>
        ${renderPatternBlocks(report)}
      </div>

      <div style="flex:1.35 1 520px;min-width:320px">
        <div class="kicker text-muted" style="margin-bottom:6px">Findings — severity order</div>
        ${findingsHtml}
        ${renderRetractedAndRejected(report, ui)}
        ${renderCaveats()}
      </div>
    </div>
  </div>
  ${renderTraceDrawer()}`;
}

/* ============================== UI: delegated handlers ============================== */

const UI = {
  nav(tab) { showTab(tab); },

  onTextInput(el) {
    state.audit.text = el.value;
    const meta = document.getElementById("meta-line");
    if (meta) meta.textContent = metaLineText(el.value);
  },
  fillExample(i) {
    const ex = state.agentInfo && state.agentInfo.prompt_examples[i];
    if (ex) setText(ex.prompt);
  },
  fillFixture() { setText(FIXTURE_TEXT); },
  clearText() {
    state.audit.text = "";
    state.audit.error = null;
    renderAudit();
    const ta = document.getElementById("audit-textarea");
    if (ta) ta.focus();
  },
  run() { startRun(); },
  resetAudit() {
    state.audit.phase = "idle";
    state.audit.error = null;
    renderAudit();
  },

  copyReportJson() {
    const st = state.audit;
    copyText(JSON.stringify(st.report, null, 2));
    st.jsonCopied = true;
    rerenderReport();
    setTimeout(() => { st.jsonCopied = false; rerenderReport(); }, 1600);
  },
  toggleRaw() {
    state.audit.rawOpen = !state.audit.rawOpen;
    rerenderReport();
  },
  copyRewrite(id) {
    const f = findFinding(id);
    if (!f) return;
    copyText(f.rewrite);
    const st = state.audit;
    st.copied[id] = true;
    rerenderReport();
    setTimeout(() => { st.copied[id] = false; rerenderReport(); }, 1600);
  },

  selectFinding(id) {
    const st = state.audit;
    st.sel = id;
    st.open = st.open === id ? null : id;
    rerenderReport();
    scrollToId("finding-" + id);
  },
  selectOnly(kind, id) {
    state.audit.sel = id;
    rerenderReport();
    scrollToId((kind === "retracted" ? "finding-" : "rejected-") + id);
  },
  pickSpan(kind, id) {
    if (kind === "kept") UI.selectFinding(id);
    else UI.selectOnly(kind, id);
  },

  toggleWhy(id) {
    const st = state.audit;
    if (st.whyOpen[id]) { st.whyOpen[id] = false; rerenderReport(); return; }
    st.whyOpen[id] = true;
    if (st.whyCache[id]) { rerenderReport(); return; } // cached — no refetch
    st.whyLoading[id] = true;
    rerenderReport();
    const f = findFinding(id);
    fetch("/api/why", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ span: f.quote, category: f.category, reason: f.explanation }),
    }).then((r) => r.json()).then((data) => {
      st.whyLoading[id] = false;
      st.whyCache[id] = data;
      rerenderReport();
    }).catch((err) => {
      st.whyLoading[id] = false;
      st.whyCache[id] = { status: "error", error: "Could not reach the agent: " + err.message };
      rerenderReport();
    });
  },

  toggleTrace() { state.audit.traceOpen = !state.audit.traceOpen; rerenderReport(); },
  toggleStep(i) { state.audit.openStep = state.audit.openStep === i ? null : i; rerenderReport(); },
};
window.UI = UI;

/* ============================== init ============================== */

function init() {
  document.getElementById("nav-audit").setAttribute("aria-current", "page");
  renderAudit();
  renderMetrics();
  loadHealth();
  loadAgentInfo();
  loadTeamInfo();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
